name: Export Archived Ranking Snapshots

# One-off / maintenance export of the frozen WoW Forever and Genshin Impact snapshots.
# The database remains authoritative; this only materializes what the publishers already wrote.
# Generated files are committed by a human after review — this workflow never commits.

on:
  workflow_dispatch:
  push:
    branches: [chore/snapshot-export-tooling]

permissions:
  contents: read

jobs:
  export:
    name: Export archived snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.14 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Export snapshots from the authoritative database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun --conditions=react-server scripts/export-archived-ranking-snapshots.ts
      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archived-ranking-snapshots
          path: |
            src/modules/meta-board/db/archived-snapshots/wow-forever.json
            src/modules/meta-board/db/archived-snapshots/registry.ts
            src/modules/genshin-tier-list/archived-snapshots/genshin-impact.json
            src/modules/genshin-tier-list/archived-snapshots/registry.ts
          if-no-files-found: error
          retention-days: 7
