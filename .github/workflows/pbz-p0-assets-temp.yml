name: PBZ final visual audit (temporary)

on:
  push:
    branches:
      - feat/phantom-blade-zero-tier-list
    paths:
      - ".github/workflows/pbz-p0-assets-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_visual
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_visual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_visual
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_visual
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format closeout files
        run: |
          bunx prettier --write \
            src/modules/phantom-blade-zero-tier-list/asset-provenance.ts \
            src/modules/phantom-blade-zero-tier-list/data.ts \
            src/modules/phantom-blade-zero-tier-list/phantom-blade-zero-tier-list.module.css \
            src/modules/phantom-blade-zero-tier-list/phantom-blade-zero-tier-list.tsx \
            tests/e2e/phantom-blade-zero-tier-list.spec.ts \
            tests/performance/marketing-performance.spec.ts
          git diff --check

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Prepare database
        run: bun run db:migrate
      - name: Build app
        run: bun run build:test
      - name: Start app
        shell: bash
        run: |
          set -euo pipefail
          bun run start > /tmp/pbz-visual-server.log 2>&1 &
          echo $! > /tmp/pbz-visual-server.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/phantom-blade-zero/tier-list >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pbz-visual-server.log
          exit 1
      - name: Capture release viewports
        shell: bash
        run: |
          mkdir -p /tmp/pbz-visual
          cat > /tmp/pbz-visual/capture.mjs <<'JS'
          import { chromium } from "@playwright/test";
          import fs from "node:fs/promises";

          const browser = await chromium.launch({ headless: true });
          const results = [];
          for (const width of [390, 768, 1440]) {
            const page = await browser.newPage({ viewport: { width, height: 900 }, deviceScaleFactor: 1 });
            const imageFailures = [];
            page.on("response", (response) => {
              if (response.request().resourceType() === "image" && response.status() >= 400) {
                imageFailures.push({ status: response.status(), url: response.url() });
              }
            });
            const response = await page.goto("http://127.0.0.1:3000/phantom-blade-zero/tier-list", {
              waitUntil: "networkidle",
            });
            await page.screenshot({
              path: `/tmp/pbz-visual/pbz-${width}.png`,
              fullPage: true,
            });
            const metrics = await page.evaluate(() => ({
              viewportWidth: innerWidth,
              documentWidth: document.documentElement.scrollWidth,
              overflow: document.documentElement.scrollWidth > innerWidth,
              hero: (() => {
                const image = document.querySelector('img[data-p0-role="hero"]');
                if (!(image instanceof HTMLImageElement)) return null;
                return {
                  naturalWidth: image.naturalWidth,
                  naturalHeight: image.naturalHeight,
                  renderedWidth: Math.round(image.getBoundingClientRect().width),
                  renderedHeight: Math.round(image.getBoundingClientRect().height),
                  currentSrc: image.currentSrc,
                };
              })(),
              tierImagesInDom: document.querySelectorAll('img[data-p0-role="tier-icon"]').length,
              loadedTierImages: [...document.querySelectorAll('img[data-p0-role="tier-icon"]')].filter(
                (node) => node instanceof HTMLImageElement && node.complete && node.naturalWidth > 0,
              ).length,
            }));
            results.push({ width, status: response?.status(), imageFailures, ...metrics });
            await page.close();
          }
          await browser.close();
          await fs.writeFile("/tmp/pbz-visual/metrics.json", JSON.stringify(results, null, 2));
          JS
          bun /tmp/pbz-visual/capture.mjs
          cat /tmp/pbz-visual/metrics.json
      - name: Upload visual audit
        uses: actions/upload-artifact@v4
        with:
          name: pbz-final-visual-audit
          path: /tmp/pbz-visual/
          if-no-files-found: error
          retention-days: 1

      - name: Commit repository-formatted closeout files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/phantom-blade-zero-tier-list
          test "$(git rev-parse origin/feat/phantom-blade-zero-tier-list)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/modules/phantom-blade-zero-tier-list/asset-provenance.ts \
            src/modules/phantom-blade-zero-tier-list/data.ts \
            src/modules/phantom-blade-zero-tier-list/phantom-blade-zero-tier-list.module.css \
            src/modules/phantom-blade-zero-tier-list/phantom-blade-zero-tier-list.tsx \
            tests/e2e/phantom-blade-zero-tier-list.spec.ts \
            tests/performance/marketing-performance.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style(phantom-blade-zero): format closeout files"
          git push origin HEAD:feat/phantom-blade-zero-tier-list
