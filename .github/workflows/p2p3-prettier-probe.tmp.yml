name: P2 P3 Prettier Probe

on:
  pull_request:
    paths:
      - "tests/performance/marketing-performance.spec.ts"
      - ".github/workflows/p2p3-prettier-probe.tmp.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Show Prettier diff
        run: |
          bunx prettier --config .prettierrc.json --write tests/performance/marketing-performance.spec.ts
          git diff -- tests/performance/marketing-performance.spec.ts
