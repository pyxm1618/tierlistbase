name: P2 P3 Wild Duplicate Probe

on:
  pull_request:
    paths:
      - "tests/e2e/p2-p3-wild-duplicate.tmp.spec.ts"
      - ".github/workflows/p2p3-wild-duplicate.tmp.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_app
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_e2e
      EMAIL_TRANSPORT: test
      TEST_EMAIL_DIR: /tmp/creat-web-test-emails
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Prepare database
        run: DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - name: Run Wild duplicate probe
        run: bunx playwright test tests/e2e/p2-p3-wild-duplicate.tmp.spec.ts
