name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change_scope:
    name: Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      vanguard: ${{ steps.scope.outputs.vanguard }}
      seo_density_targets: ${{ steps.scope.outputs.seo_density_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect targeted CI scopes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "vanguard=true" >> "$GITHUB_OUTPUT"
            echo "seo_density_targets=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${PR_BASE_SHA:-}" ] && [ -n "${PR_HEAD_SHA:-}" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [ -n "${PUSH_BASE_SHA:-}" ] && [ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BASE_SHA"
            head="$GITHUB_SHA"
          else
            base="$GITHUB_SHA^"
            head="$GITHUB_SHA"
          fi

          changed="$(git diff --name-only "$base...$head")"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^\.github/workflows/ci\.yml$|(^|/)(wow-vanguard|vanguard)(/|[-_.])|^playwright\.vanguard\.config\.ts$|^tests/e2e/start-vanguard-test-server\.ts$|^src/platform/(auth|database|email)/|^src/app/globals\.css$|^src/app/\(marketing\)/layout\.tsx$|^src/components/navigation/site-header'; then
            echo "vanguard=true" >> "$GITHUB_OUTPUT"
          else
            echo "vanguard=false" >> "$GITHUB_OUTPUT"
          fi

          seo_density_targets=""
          if printf '%s\n' "$changed" | grep -Eq '^tests/seo/keyword-density(\.config)?\.ts$|^tests/e2e/seo-keyword-density\.spec\.ts$|^src/config/routes\.config\.ts$|^src/components/marketing/|^src/app/\(marketing\)/layout\.tsx$'; then
            seo_density_targets="all"
          else
            add_seo_density_target() {
              local target="$1"
              if [ -z "$seo_density_targets" ]; then
                seo_density_targets="$target"
              elif [[ ",$seo_density_targets," != *",$target,"* ]]; then
                seo_density_targets="$seo_density_targets,$target"
              fi
            }

            if printf '%s\n' "$changed" | grep -Eq '^src/app/\(marketing\)/page\.tsx$|^src/components/home/game-home\.tsx$'; then add_seo_density_target "home"; fi
            if printf '%s\n' "$changed" | grep -Eq '^src/app/\(marketing\)/wow-forever/tier-list/|^src/modules/meta-board/wow/'; then add_seo_density_target "wow"; fi
            if printf '%s\n' "$changed" | grep -Eq '^src/app/\(marketing\)/genshin-impact/tier-list/|^src/modules/genshin-tier-list/'; then add_seo_density_target "genshin"; fi
            if printf '%s\n' "$changed" | grep -Eq '^src/app/\(marketing\)/zenless-zone-zero/tier-list/|^src/modules/.*(zenless|zzz).*tier-list/'; then add_seo_density_target "zzz"; fi
            if printf '%s\n' "$changed" | grep -Eq '^src/app/\(marketing\)/nikke/tier-list/|^src/modules/nikke-tier-list/'; then add_seo_density_target "nikke"; fi
            if printf '%s\n' "$changed" | grep -Eq '^src/app/\(marketing\)/limbus-company/tier-list/|^src/modules/limbus-tier-list/'; then add_seo_density_target "limbus"; fi
            if printf '%s\n' "$changed" | grep -Eq '^src/app/\(marketing\)/phantom-blade-zero/tier-list/|^src/modules/phantom-blade-zero-tier-list/'; then add_seo_density_target "phantom-blade-zero"; fi
            if printf '%s\n' "$changed" | grep -Eq '^src/app/\(marketing\)/dragon-traveler/tier-list/|^src/modules/dragon-traveler-tier-list/'; then add_seo_density_target "dragon-traveler"; fi
            if printf '%s\n' "$changed" | grep -Eq '^src/app/\(marketing\)/wild-rift/tier-list/|^src/modules/wild-rift-tier-list/'; then add_seo_density_target "wild-rift"; fi
            if printf '%s\n' "$changed" | grep -Eq '^src/app/\(marketing\)/anime-expeditions/tier-list/|^src/modules/anime-expeditions-tier-list/'; then add_seo_density_target "anime-expeditions"; fi
            if printf '%s\n' "$changed" | grep -Eq '^src/app/\(marketing\)/slay-the-spire-2/tier-list/|^src/modules/slay-the-spire-2-tier-list/'; then add_seo_density_target "slay-the-spire-2"; fi
          fi

          echo "seo_density_targets=${seo_density_targets:-skip}" >> "$GITHUB_OUTPUT"

  quality_core:
    name: Quality Core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_app
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_test
      BETTER_AUTH_SECRET: schema-generation-secret-with-at-least-32-characters
      TEST_EMAIL_DIR: /tmp/creat-web-test-emails
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Diff whitespace hygiene
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_SHA:-}" ] && [ -n "${PR_HEAD_SHA:-}" ]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [ -n "${PUSH_BASE_SHA:-}" ] && [ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$PUSH_BASE_SHA...$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          fi
      - name: Verify Better Auth schema generation
        run: |
          bunx auth@1.7.7 generate --config src/platform/auth/auth-cli.ts --output /tmp/auth-schema.ts --yes
          bunx prettier --config .prettierrc.json --write /tmp/auth-schema.ts
          diff -u src/platform/database/auth-schema.ts /tmp/auth-schema.ts
      - name: Formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:unit

  integration:
    name: Database + Contract Integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_app
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_test
      BETTER_AUTH_SECRET: schema-generation-secret-with-at-least-32-characters
      TEST_EMAIL_DIR: /tmp/creat-web-test-emails
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: PostgreSQL integration tests
        run: bun run test:integration
      - name: Credit expiry race verification (30 runs)
        run: bun run verify:credit-races
      - name: Isolated database restore drill
        run: |
          set -euo pipefail
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}' | head -n 1)"
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" dropdb -U postgres --if-exists creat_web_restore_source
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres creat_web_restore_source
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/creat_web_restore_source bun run db:migrate
          docker exec "$POSTGRES_CONTAINER" pg_dump -U postgres -d creat_web_restore_source -Fc > /tmp/creat-web.dump
          docker exec "$POSTGRES_CONTAINER" dropdb -U postgres --if-exists creat_web_restore
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres creat_web_restore
          cat /tmp/creat-web.dump | docker exec -i "$POSTGRES_CONTAINER" pg_restore -U postgres -d creat_web_restore --no-owner --no-acl
          RESTORED_DATABASE_URL=postgres://postgres:postgres@localhost:5432/creat_web_restore bun scripts/verify-restored-database.ts
          rm -f /tmp/creat-web.dump
      - name: Provider contract tests
        run: bun run test:contract
      - name: Migration verification
        run: bun run db:verify

  product_gates:
    name: Product Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_app
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_test
      BETTER_AUTH_SECRET: schema-generation-secret-with-at-least-32-characters
      TEST_EMAIL_DIR: /tmp/creat-web-test-emails
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Repository secret scan
        run: bun run verify:secrets
      - name: SEO verification
        run: bun run verify:seo
      - name: i18n verification
        run: bun run verify:i18n
      - name: Security verification
        run: bun run verify:security
      - name: Subscription verification
        run: bun run verify:subscription
      - name: Commerce verification
        run: bun run verify:commerce
      - name: Credit verification
        run: bun run verify:credits
      - name: Supply-chain audit
        run: bun run verify:supply-chain
      - name: Release verification
        run: bun run verify:release --mode=test

  build_runtime:
    name: Build + Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_app
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_test
      BETTER_AUTH_SECRET: schema-generation-secret-with-at-least-32-characters
      TEST_EMAIL_DIR: /tmp/creat-web-test-emails
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Optional-provider build matrix
        run: bun run test:build-matrix
      - name: Production application build
        run: bun run build
      - name: Vanguard vinext build verification
        run: bun run build:vinext
      - name: Cloudflare artifact runtime smoke
        run: bun run test:runtime:cloudflare

  performance:
    name: Performance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_perf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_perf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_app
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_perf
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Prepare database
        run: DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - name: Real-page performance budgets
        run: bun run verify:performance

  e2e:
    name: End-to-End
    needs: [change_scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_app
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_e2e
      BETTER_AUTH_SECRET: e2e-better-auth-secret-with-at-least-32-characters
      EMAIL_TRANSPORT: test
      TEST_EMAIL_DIR: /tmp/creat-web-test-emails
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Prepare database and mailbox
        run: |
          rm -rf "$TEST_EMAIL_DIR"
          DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - name: Browser end-to-end tests
        run: bun run test:e2e
      - name: Production-mode canonical and security output
        run: DATABASE_URL="$TEST_DATABASE_URL" bun run verify:seo:production
      - name: Targeted SEO keyword density audit
        if: always() && needs.change_scope.outputs.seo_density_targets != 'skip'
        env:
          SEO_DENSITY_TARGETS: ${{ needs.change_scope.outputs.seo_density_targets }}
          SEO_DENSITY_MODE: enforce
        run: bun run test:seo-density

  vanguard_e2e:
    name: Vanguard Full E2E
    needs: [change_scope]
    if: needs.change_scope.outputs.vanguard == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_app
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_e2e
      BETTER_AUTH_SECRET: e2e-better-auth-secret-with-at-least-32-characters
      EMAIL_TRANSPORT: test
      TEST_EMAIL_DIR: /tmp/creat-web-test-emails
      CREAT_WEB_E2E_VANGUARD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Prepare database
        run: DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - name: Vanguard Google-only browser flows
        run: bunx playwright test --config=playwright.vanguard.config.ts

  template_clean_setup:
    name: Template Clean Setup (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_clean
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_clean"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLEAN_SETUP_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_clean
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Install harness dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium prerequisite
        run: bunx playwright install --with-deps chromium
      - name: Verify independent clean setup
        run: bun scripts/verify-clean-setup.ts

  ci_required:
    name: CI Required
    if: always()
    needs:
      - change_scope
      - quality_core
      - integration
      - product_gates
      - build_runtime
      - performance
      - e2e
      - vanguard_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI contract
        shell: bash
        run: |
          set -euo pipefail
          echo "Change Scope: ${{ needs.change_scope.result }}"
          echo "Quality Core: ${{ needs.quality_core.result }}"
          echo "Integration: ${{ needs.integration.result }}"
          echo "Product Contracts: ${{ needs.product_gates.result }}"
          echo "Build + Runtime: ${{ needs.build_runtime.result }}"
          echo "Performance: ${{ needs.performance.result }}"
          echo "End-to-End: ${{ needs.e2e.result }}"
          echo "Vanguard Full E2E: ${{ needs.vanguard_e2e.result }}"
          test "${{ needs.change_scope.result }}" = "success"
          test "${{ needs.quality_core.result }}" = "success"
          test "${{ needs.integration.result }}" = "success"
          test "${{ needs.product_gates.result }}" = "success"
          test "${{ needs.build_runtime.result }}" = "success"
          test "${{ needs.performance.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
          test "${{ needs.vanguard_e2e.result }}" = "success" || test "${{ needs.vanguard_e2e.result }}" = "skipped"

  deploy:
    name: Production Deploy
    if: ${{ always() && github.event_name == 'push' && github.ref_name == 'main' && needs.ci_required.result == 'success' }}
    needs: [ci_required]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.14 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build for Cloudflare
        run: bun run build:vinext
      - name: Verify production schema compatibility (read only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun scripts/verify-production-schema.ts
      - name: Deploy current main to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          current_main="$(git rev-parse FETCH_HEAD)"
          if [ "$GITHUB_SHA" != "$current_main" ]; then
            echo "::error::Refusing stale production deploy: workflow SHA $GITHUB_SHA is not current main $current_main."
            exit 1
          fi
          bun run deploy:vinext
