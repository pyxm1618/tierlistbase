name: P0 Image Closeout Temp

on:
  push:
    branches:
      - perf/image-p0-zzz-nikke
  pull_request:
    types:
      - reopened
    branches:
      - main

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_app
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_test
      BETTER_AUTH_SECRET: p0-image-closeout-secret-with-at-least-32-characters
      TEST_EMAIL_DIR: /tmp/creat-web-test-emails

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run production image migration
        shell: bash
        run: |
          set -euo pipefail
          bun tests/performance/p0-image-optimize.mjs | tee /tmp/p0-image-optimize.log
          test -s /tmp/p0-image-report.json

      - name: Remove one-time migration experiments
        shell: bash
        run: |
          set -euo pipefail
          rm -f tests/performance/p0-codec-bundle.js
          rm -f tests/performance/p0-nikke-batch.js
          rm -f tests/performance/p0-image-optimize.mjs

      - name: Format generated production references and gates
        run: |
          bunx prettier --write             src/modules/zenless-zone-zero-tier-list/icons.ts             src/modules/nikke-tier-list/character-avatars.ts             zzz-asset-manifest.json             tests/unit/zenless-zone-zero-tier-list/assets.test.ts             tests/unit/zenless-zone-zero-tier-list/image-performance.test.ts             tests/unit/nikke/character-avatars.test.ts             tests/unit/nikke/image-performance.test.ts

      - name: Verify transformed asset shape
        shell: bash
        run: |
          set -euo pipefail
          test "$(find src/modules/zenless-zone-zero-tier-list/assets/agents -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 61
          test "$(find src/modules/zenless-zone-zero-tier-list/assets/w-engines -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 77
          test "$(find src/modules/zenless-zone-zero-tier-list/assets/bangboo -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 18
          test "$(find src/modules/zenless-zone-zero-tier-list/assets/teams -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 9
          test "$(find src/modules/nikke-tier-list/assets/avatars -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 203
          test -z "$(find src/modules/zenless-zone-zero-tier-list/assets/agents src/modules/zenless-zone-zero-tier-list/assets/w-engines src/modules/zenless-zone-zero-tier-list/assets/bangboo src/modules/zenless-zone-zero-tier-list/assets/teams -type f -name '*.png' -print -quit)"
          test -z "$(find src/modules/nikke-tier-list/assets/avatars -type f -name '*.png' -print -quit)"
          ! grep -E 'assets/(agents|w-engines|bangboo|teams)/[^"]+\.png' src/modules/zenless-zone-zero-tier-list/icons.ts
          ! grep -E 'assets/avatars/[^"]+\.png' src/modules/nikke-tier-list/character-avatars.ts
          git diff --check

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Targeted image asset tests
        run: |
          bunx vitest run --config vitest.config.ts             tests/unit/zenless-zone-zero-tier-list/assets.test.ts             tests/unit/zenless-zone-zero-tier-list/image-performance.test.ts             tests/unit/nikke/character-avatars.test.ts             tests/unit/nikke/image-performance.test.ts

      - name: Unit
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: Locate runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_bin"
          "$chrome_bin" --version
          echo "P0_CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"

      - name: Prepare browser verification database
        run: DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate

      - name: Browser verification at required viewports
        shell: bash
        run: |
          set -euo pipefail
          APP_ENV=test APP_ORIGIN=http://127.0.0.1:3000 DATABASE_URL="$TEST_DATABASE_URL"             bunx next start -H 127.0.0.1 -p 3000 >/tmp/p0-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null

          cat >/tmp/p0-browser-check.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.P0_CHROME_BIN,
            args: ["--no-sandbox"],
          });
          const routes = ["/zenless-zone-zero/tier-list", "/nikke/tier-list"];
          const widths = [390, 768, 1440, 1920];
          const results = [];
          let totalBroken = 0;

          for (const route of routes) {
            for (const width of widths) {
              const context = await browser.newContext({
                viewport: { width, height: Math.max(800, Math.round(width * 0.65)) },
                deviceScaleFactor: 1,
              });
              const page = await context.newPage();
              const imageFailures = [];
              const nextImageStatuses = [];
              const requestFailures = [];
              const pageErrors = [];

              await page.addInitScript(() => {
                window.__p0Cls = 0;
                new PerformanceObserver((list) => {
                  for (const entry of list.getEntries()) {
                    if (!entry.hadRecentInput) window.__p0Cls += entry.value;
                  }
                }).observe({ type: "layout-shift", buffered: true });
              });

              page.on("response", (response) => {
                const url = response.url();
                if (url.includes("/_next/image")) nextImageStatuses.push(response.status());
                if (response.request().resourceType() === "image" && response.status() >= 400) {
                  imageFailures.push({ url, status: response.status() });
                }
              });
              page.on("requestfailed", (request) => {
                if (request.resourceType() === "image") {
                  requestFailures.push({
                    url: request.url(),
                    error: request.failure()?.errorText ?? "unknown",
                  });
                }
              });
              page.on("pageerror", (error) => pageErrors.push(error.message));

              const response = await page.goto("http://127.0.0.1:3000" + route, {
                waitUntil: "networkidle",
              });
              if (!response || response.status() >= 400) {
                throw new Error(route + " returned " + (response?.status() ?? "no response"));
              }

              let lastHeight = 0;
              for (let pass = 0; pass < 3; pass++) {
                const height = await page.evaluate(() => document.documentElement.scrollHeight);
                if (height === lastHeight && pass > 0) break;
                lastHeight = height;
                const step = Math.max(350, Math.round((await page.viewportSize()).height * 0.7));
                for (let y = 0; y < height; y += step) {
                  await page.evaluate((scrollY) => window.scrollTo(0, scrollY), y);
                  await page.waitForTimeout(50);
                }
              }
              await page.evaluate(() => window.scrollTo(0, 0));
              await page.waitForTimeout(350);

              const dom = await page.evaluate(() => {
                const images = [...document.images];
                const broken = images
                  .filter((img) => img.complete && img.naturalWidth === 0)
                  .map((img) => ({ alt: img.alt, src: img.currentSrc || img.src }));
                const cls = Number(window.__p0Cls ?? 0);
                const resources = performance
                  .getEntriesByType("resource")
                  .map((entry) => ({
                    name: entry.name,
                    encodedBodySize: entry.encodedBodySize,
                    transferSize: entry.transferSize,
                  }));
                const nextImages = resources.filter((entry) => entry.name.includes("/_next/image"));
                const oldScopedPng = nextImages.filter((entry) => {
                  const decoded = decodeURIComponent(entry.name);
                  return (
                    decoded.includes(".png") &&
                    (decoded.includes("avatars") ||
                      decoded.includes("agents") ||
                      decoded.includes("w-engines") ||
                      decoded.includes("bangboo") ||
                      decoded.includes("team-visual"))
                  );
                });
                return {
                  imageCount: images.length,
                  broken,
                  cls,
                  nextImageCount: nextImages.length,
                  largestNextImageEncodedBytes: Math.max(
                    0,
                    ...nextImages.map((entry) => entry.encodedBodySize || 0),
                  ),
                  oldScopedPng,
                };
              });

              totalBroken += dom.broken.length + imageFailures.length + requestFailures.length;
              if (dom.broken.length || imageFailures.length || requestFailures.length) {
                throw new Error(
                  JSON.stringify({ route, width, broken: dom.broken, imageFailures, requestFailures }),
                );
              }
              if (pageErrors.length) {
                throw new Error(JSON.stringify({ route, width, pageErrors }));
              }
              if (dom.nextImageCount === 0 || nextImageStatuses.length === 0) {
                throw new Error(route + "@" + width + " did not exercise /_next/image");
              }
              if (nextImageStatuses.some((status) => status >= 400)) {
                throw new Error(
                  JSON.stringify({ route, width, nextImageStatuses }),
                );
              }
              if (dom.oldScopedPng.length) {
                throw new Error(JSON.stringify({ route, width, oldScopedPng: dom.oldScopedPng }));
              }
              if (dom.cls > 0.15) {
                throw new Error(route + "@" + width + " CLS too high: " + dom.cls);
              }

              results.push({
                route,
                width,
                imageCount: dom.imageCount,
                brokenImages: 0,
                nextImageCount: dom.nextImageCount,
                nextImageStatuses: [...new Set(nextImageStatuses)],
                largestNextImageEncodedBytes: dom.largestNextImageEncodedBytes,
                cls: dom.cls,
              });
              await context.close();
            }
          }

          await browser.close();
          console.log("P0_BROWSER_REPORT_START");
          console.log(JSON.stringify({ results, totalBroken }));
          console.log("P0_BROWSER_REPORT_END");
          EOF

          bun /tmp/p0-browser-check.mjs | tee /tmp/p0-browser-report.log

      - name: Stage only P0 production closeout scope
        shell: bash
        run: |
          set -euo pipefail
          git add -A             src/modules/zenless-zone-zero-tier-list/assets             src/modules/zenless-zone-zero-tier-list/icons.ts             zzz-asset-manifest.json             tests/unit/zenless-zone-zero-tier-list             src/modules/nikke-tier-list/assets/avatars             src/modules/nikke-tier-list/character-avatars.ts             tests/unit/nikke             tests/performance/p0-codec-bundle.js             tests/performance/p0-nikke-batch.js             tests/performance/p0-image-optimize.mjs

          git fetch origin main
          git diff --cached --name-only HEAD > /tmp/p0-final-files.txt
          git diff --cached --diff-filter=ACMRTUXB --name-only HEAD > /tmp/p0-final-nondeletes.txt
          bad="$(grep -Ev '^(\.github/workflows/p0-image-closeout-temp\.yml|zzz-asset-manifest\.json|src/modules/zenless-zone-zero-tier-list/(assets/|icons\.ts$)|tests/unit/zenless-zone-zero-tier-list/|src/modules/nikke-tier-list/(assets/avatars/|character-avatars\.ts$)|tests/unit/nikke/|tests/performance/p0-(codec-bundle\\.js|nikke-batch\\.js|image-optimize\\.mjs)$)' /tmp/p0-final-nondeletes.txt || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected final P0 path(s):"
            echo "$bad"
            exit 1
          fi
          test ! -e tests/performance/p0-codec-bundle.js
          test ! -e tests/performance/p0-nikke-batch.js
          test ! -e tests/performance/p0-image-optimize.mjs
          cat /tmp/p0-final-files.txt

      - name: Commit transformed production assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf(images): optimize ZZZ and NIKKE P0 production assets"
          echo "P0_PRODUCTION_COMMIT=$(git rev-parse HEAD)"
          echo "P0_DIFF_FILE_COUNT=$(git diff --name-only origin/main...HEAD | wc -l | tr -d ' ')"
          git diff --stat origin/main...HEAD | tail -n 1
          cat /tmp/p0-image-report.json
          cat /tmp/p0-browser-report.log
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          git push origin HEAD:perf/image-p0-zzz-nikke
