name: NIKKE Format Helper

on:
  push:
    branches: [feat/nikke-tier-list-design]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style(nikke): apply prettier formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nikke-tier-list-design
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx prettier --config .prettierrc.json --write src/modules/nikke-tier-list/nikke-tier-list.tsx src/modules/nikke-tier-list/nikke-tier-list.module.css src/app/'(marketing)'/nikke/tier-list/page.tsx
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/modules/nikke-tier-list/nikke-tier-list.tsx src/modules/nikke-tier-list/nikke-tier-list.module.css src/app/'(marketing)'/nikke/tier-list/page.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(nikke): apply prettier formatting"
          git push origin HEAD:feat/nikke-tier-list-design
