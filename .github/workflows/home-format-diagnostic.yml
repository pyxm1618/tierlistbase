name: Home format/type diagnostic
on:
  push:
    branches:
      - feat/home-design-architecture-20261011
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Print formatted changes and type errors
        shell: bash
        run: |
          bun -e 'import prettier from "prettier"; import fs from "node:fs/promises"; for (const path of ["src/components/home/game-home.css","src/components/home/game-home.tsx","src/components/navigation/site-header.tsx","src/components/navigation/site-footer.tsx"]){let config=await prettier.resolveConfig(path);let content=await prettier.format(await fs.readFile(path,"utf8"),{...config,filepath:path});console.log("FORMAT_DUMP:"+JSON.stringify({path,content}));}'
          bun run typecheck || true
