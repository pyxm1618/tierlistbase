name: Temporary formatting diagnostics
on:
  push:
    branches: [feat/home-design-architecture-20261011]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: |
          bun -e 'import prettier from "prettier";import fs from "node:fs/promises";let path="tests/e2e/homepage.spec.ts";let content=await prettier.format(await fs.readFile(path,"utf8"),{...await prettier.resolveConfig(path),filepath:path});console.log("FORMAT_DUMP:"+JSON.stringify({path,content}));'
