name: Wild Rift temporary formatter

on:
  push:
    branches:
      - feat/wild-rift-tier-list-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wild-rift-tier-list-v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format Wild Rift files
        run: |
          bunx prettier --write             src/modules/wild-rift-tier-list/data.ts             src/modules/wild-rift-tier-list/wild-rift-tier-list.module.css             src/modules/wild-rift-tier-list/wild-rift-workspace.tsx             tests/e2e/wild-rift-tier-list.spec.ts             tests/unit/wild-rift-tier-list/data.test.ts
      - name: Commit formatted output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/modules/wild-rift-tier-list/data.ts             src/modules/wild-rift-tier-list/wild-rift-tier-list.module.css             src/modules/wild-rift-tier-list/wild-rift-workspace.tsx             tests/e2e/wild-rift-tier-list.spec.ts             tests/unit/wild-rift-tier-list/data.test.ts
          git commit -m "style(wild-rift): apply repository formatting"
          git push origin HEAD:feat/wild-rift-tier-list-v2
